<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </radialGradient>

    <!-- Sigmoid Activation Gradient -->
    <linearGradient id="sigmoidGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="2"/>

  <!-- Linear Weight Projections (Dense Connections: Wx + b) -->
  <g stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.65">
    <line x1="144" y1="376" x2="224" y2="136"/>
    <line x1="144" y1="376" x2="300" y2="136"/>
    <line x1="144" y1="376" x2="376" y2="136"/>

    <line x1="220" y1="376" x2="224" y2="136"/>
    <line x1="220" y1="376" x2="300" y2="136"/>
    <line x1="220" y1="376" x2="376" y2="136"/>

    <line x1="296" y1="376" x2="224" y2="136"/>
    <line x1="296" y1="376" x2="300" y2="136"/>
    <line x1="296" y1="376" x2="376" y2="136"/>
  </g>

  <!-- Bottom Layer Slab (Layer L) -->
  <rect x="88" y="348" width="260" height="56" rx="28" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <circle cx="144" cy="376" r="7" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <circle cx="220" cy="376" r="7" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <circle cx="296" cy="376" r="7" fill="#1E293B" stroke="#475569" stroke-width="2"/>

  <!-- Top Layer Slab (Layer L+1) -->
  <rect x="164" y="108" width="260" height="56" rx="28" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <circle cx="224" cy="136" r="7" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <circle cx="300" cy="136" r="7" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <circle cx="376" cy="136" r="7" fill="#1E293B" stroke="#475569" stroke-width="2"/>

  <!-- Glow Underlay for Activation Curve -->
  <path d="M 96,376 C 180,376 216,316 256,256 C 296,196 332,136 416,136"
        fill="none" stroke="url(#sigmoidGrad)" stroke-width="36" stroke-linecap="round" opacity="0.3" filter="url(#glow)"/>

  <!-- The Sigmoid Curve (Non-linear Activation: \sigma) -->
  <path d="M 96,376 C 180,376 216,316 256,256 C 296,196 332,136 416,136"
        fill="none" stroke="url(#sigmoidGrad)" stroke-width="24" stroke-linecap="round"/>

  <!-- Terminal Nodes -->
  <circle cx="96" cy="376" r="5" fill="#E2E8F0"/>
  <circle cx="416" cy="136" r="5" fill="#E2E8F0"/>
</svg>
