stages:
  - image
  - build
  - deploy

variables:
  BASE_URL: "" # "/$CI_PROJECT_NAME"
  HOST: "127.0.0.1"
  # Die Adresse, unter der das Buch wirklich steht. MyST kennt sie beim Bauen nicht und
  # schreibt statt dessen die seines eigenen Dev-Servers in sitemap.xml und robots.txt;
  # der pages-Job traegt sie nach (tools/publish_urls.py).
  #
  # Bewusst der 131e30-Host und nicht "voelkel.pages.cs.uni-duesseldorf.de/eidl-skript":
  # Diese zweite Schreibweise antwortet mit 308 auf die erste (am 2026-10-19 gemessen).
  # Canonical, og:url und jede <loc> muessen die URL nennen, die 200 liefert.
  SITE_ORIGIN: "https://eidl-skript-131e30.pages.cs.uni-duesseldorf.de"

# Baut das Projekt-Image neu, wenn sich sein Rezept aendert. Ohne das bleibt das Image im
# Registry auf dem Stand seines letzten Baus stehen, waehrend das Repo etwas anderes
# behauptet -- der haeufigste CI-Ausfall dieser Buchfamilie (siehe PLAYBOOK 3.1).
#
# `kaniko` statt Docker-in-Docker: braucht keinen privilegierten Runner und laeuft mit dem
# gewoehnlichen docker-Executor. Zugangsdaten kommen aus den von GitLab selbst gesetzten
# Variablen; hier steht kein Geheimnis im Klartext.
#
# Zwei Tags: `latest` benutzen die anderen Jobs, das Kurz-SHA erlaubt es, im Zweifel auf
# ein bestimmtes Image zurueckzugehen.
build-image:
  stage: image
  image:
    # Version angeheftet -- ein unangehefteter `:debug`-Tag ist derselbe Fehler eine Ebene
    # hoeher.
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    # Auf Branches ausserhalb des Default-Branch nie.
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    # Automatisch, wenn sich das Image-Rezept aendert. `devnotes/patch_myst_tex.py` gehoert
    # dazu: Das Dockerfile kopiert die Datei hinein und fuehrt sie aus.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Dockerfile
        - devnotes/patch_myst_tex.py
    # Und von Hand ausloesbar, etwa wenn das Basis-Image angehoben wurde.
    - when: manual
      allow_failure: true
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:latest"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --cache=true --cache-repo "${CI_REGISTRY_IMAGE}/cache"
      --cache-ttl=336h --snapshot-mode=redo

# Kein `needs` auf build-image: Wenn das Dockerfile unveraendert ist, ist der Job manuell,
# und eine `needs`-Abhaengigkeit auf einen wartenden manuellen Job wuerde diesen Job (und
# damit die ganze Pipeline) ueberspringen. Die Stage-Reihenfolge baut das Image ohnehin
# zuerst; weil die Pull-Policy des Runners `always` ist, benutzt dieser Job in derselben
# Pipeline schon das neue Image.
#
# Das Site-Template liegt im Projekt (`_site/vendor/book-theme.zip`) und wird vor dem Build
# an die Stelle entpackt, an der MyST es zwischenspeichert. Ohne das laedt `myst build` es
# bei *jedem* Lauf von `book-theme/archive/refs/heads/main` -- von einem wandernden Branch,
# was zweimal weh tut: Das Aussehen der Seite ist eine unversionierte Abhaengigkeit, und
# jeder Netzausfall bricht den Build. Begruendung in `_site/vendor/README.md`.
#
# `retry` deckt nur Runner- und Timeout-Probleme ab, bewusst *ohne* `script_failure`: Ein
# echter Fehler im Buch soll einmal scheitern, nicht dreimal.
myst-build:
  stage: build
  image: $CI_REGISTRY_IMAGE:latest
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - python3 _site/vendor/install_template.py
    # Die Vorschaukarte ist eingecheckt und steht als `thumbnail:` in myst.yml. Geprueft
    # wird die Form (1200x630) und, aus dem tEXt-Block der PNG, ob sie noch den Titel
    # aus myst.yml zeigt -- erzeugt wird sie nie in der CI. Nur Standardbibliothek.
    - python3 tools/social_card.py --verify
  script:
    - node -v
    - myst --version
    - myst build --html
  artifacts:
    paths:
      - _build/html

# PDF via xelatex (TeX Live steckt im CI-Image). `allow_failure: true` ist eine bewusste
# Asymmetrie: Der Web-Bau blockiert die Veroeffentlichung, der PDF-Bau nicht -- ein
# LaTeX-Problem soll die Website nicht aufhalten. Der Fehlschlag ist in der Pipeline
# trotzdem sichtbar.
#
# Wichtig: `myst build --pdf` allein genuegt **nicht** als Pruefung. Der Befehl endet auch
# dann mit Exit-Code 0, wenn LaTeX nach hundert Fehlern abgebrochen ist und die Haelfte des
# Buchs im PDF fehlt (in eipy-skript am 2026-09-25: 226 statt 435 Seiten, Exit 0). Deshalb
# laeuft danach devnotes/check_pdf_build.py: Es zaehlt Fehler im `-file-line-error`-Format,
# erkennt den Abbruch wegen Fehlerflut, zaehlt fehlende Glyphen und prueft Seitenzahl sowie
# Stichproben aus den letzten Kapiteln.
#
# Die Ausgabe von MyST wird mitgeschrieben: MyST meldet **dort** (nicht im LaTeX-Log), wenn
# es einen Knoten nicht uebersetzen kann und weglaesst -- mit Exit 0.
#
# Die beiden `--expect`-Kommandozeilen sind die Gegenprobe zu dem Fehler, den
# devnotes/patch_myst_tex.py behebt: Ohne den Patch stuende dort `nvidia -smi` und
# `- -index -url`, und dieser Job wuerde es merken.
#
# Lokal bauen: `uv run --only-group dev myst build --pdf` (nach `uv sync` einmal
# `uv run --no-project devnotes/patch_myst_tex.py`).
build-pdf:
  stage: build
  image: $CI_REGISTRY_IMAGE:latest
  allow_failure: true
  before_script:
    - python3 _site/vendor/install_template.py
  script:
    - myst build --pdf 2>&1 | tee myst-pdf.log
    - python3 devnotes/check_pdf_build.py
        --min-pages 100
        --expect "Adversarial Example"
        --expect "nvidia-smi"
        --expect "pip install torch torchvision --index-url"
        --myst-log myst-pdf.log
  artifacts:
    paths:
      - exports/eidl-skript.pdf

# Veroeffentlicht die Website **und** das PDF. Ein Job-Artefakt allein genuegt nicht: Es
# verfaellt und ist nur ueber die Job-Seite erreichbar, also nicht verlinkbar. Unter
# `public/` liegt es als `<pages-url>/eidl-skript.pdf`, und `downloads:` in myst.yml
# verlinkt genau diesen Pfad im Buch.
pages:
  stage: deploy
  # Frueher busybox:latest. Jetzt Alpine mit Python, weil die drei Nachbearbeitungen
  # unten Python brauchen; installiert wird dabei **kein** Paket, sie kommen mit der
  # Standardbibliothek aus (CLAUDE.md, bewusste Entscheidung 5).
  image: python:3.13-alpine
  needs:
    - myst-build
    - build-pdf
  variables:
    # tools/inject_jsonld.py liest das Aenderungsdatum je Kapitel aus "git log" der
    # Quelldatei. GitLab klont flach (GIT_DEPTH 20); gegen einen Commit ohne Eltern
    # meldet git *jede* Datei als von ihm geaendert, und dann traegt jede Seite die
    # Sekunde des Deploys statt ihres echten Datums. Also volle Historie fuer diesen Job.
    GIT_DEPTH: "0"
  script:
    # git nachinstallieren: python:3.13-alpine bringt keins mit, und ohne git bricht
    # inject_jsonld.py ab (absichtlich -- es raet kein Datum).
    - apk add --no-cache git >/dev/null
    - mv _build/html public
    # Ganze Zeile in Anfuehrungszeichen: Ein `: ` in einem unquotierten YAML-Skalar macht
    # aus dem Listeneintrag eine Map. Die Datei bleibt dabei valides YAML, GitLab lehnt sie
    # aber ab ("script config should be a string") -- und dann laeuft kein einziger Job.
    # devnotes/check_ci_yaml.py prueft das vor dem Push.
    - 'if [ -f exports/eidl-skript.pdf ]; then cp exports/eidl-skript.pdf public/; echo "PDF veroeffentlicht"; else echo "WARNUNG - kein PDF im Artefakt, Website ohne PDF"; fi'
    # Google Search Console, Datei-Methode. Die Datei aus der Search Console liegt in
    # `_site/` und wird hier nach `public/` kopiert; sie ist dann unter
    # `<pages-url>/google<token>.html` abrufbar. Kein Geheimnis -- oeffentlich abrufbar
    # zu sein ist ja gerade der Eigentumsnachweis.
    #
    # Die Meta-Tag-Methode waere seit tools/head_meta.py ebenfalls billig (das Skript
    # patcht den <head> ohnehin). Die Datei bleibt trotzdem die Wahl: Sie haengt an
    # keiner Annahme ueber das erzeugte HTML und ueberlebt damit jedes MyST-Update.
    #
    # Die drei Nachbearbeitungen unten fassen sie nicht an -- alle drei laufen ueber
    # `index.html`, und `--check` prueft Canonicals nur dort. Fehlt die Datei, laeuft
    # der Job trotzdem durch.
    - 'if ls _site/google*.html >/dev/null 2>&1; then cp _site/google*.html public/; echo "Google-Verifikationsdatei veroeffentlicht"; else echo "Hinweis - keine Google-Verifikationsdatei in _site/"; fi'
    # --- Veroeffentlichungs-Metadaten ---------------------------------------------------
    # 1. Die echte Adresse in sitemap.xml und robots.txt, jede <loc> mit Schraegstrich,
    #    og:image absolut, Canonical je Seite. Ohne diesen Schritt nennt die Sitemap
    #    30-mal "http://localhost:3000" und die Vorschaukarte bleibt in jedem geteilten
    #    Link leer. Begruendung im Docstring des Skripts.
    - python3 tools/publish_urls.py "$SITE_ORIGIN$BASE_URL" public --base "$BASE_URL"
    # 2. og:url, og:site_name, og:type, og:locale, twitter:card; lang="de" samt Waechter
    #    gegen die Hydration; zu kleine Abbildungen als Vorschaukarte durch die echte
    #    Karte ersetzen; Abbildungen unter der Falz verzoegert laden. **Nach** Schritt 1:
    #    og:url bekommt dieselbe URL wie der Canonical.
    - python3 tools/head_meta.py "$SITE_ORIGIN$BASE_URL" public --lang de
    # 3. JSON-LD: ein Buchknoten mit den zwei anderen Skripten desselben Autors auf der
    #    Landingpage, je ein Kapitelknoten mit Brotkrume auf den 29 uebrigen Seiten.
    #    **Nach** 1 und 2: Es liest die absolute Karten-URL und den Kapiteltitel zurueck.
    - python3 tools/inject_jsonld.py "$SITE_ORIGIN$BASE_URL" public
    # Und danach am fertigen Artefakt nachzaehlen statt dem Protokoll zu glauben: kein
    # localhost, je genau ein Canonical, Sitemap-Eintraege gleich gebaute Seiten, keine
    # relative Bild-URL. Ein fehlendes Stueck davon ist im Browser unsichtbar und nur
    # von aussen zu messen -- derselbe Fehlertyp wie die localhost-Sitemap selbst.
    - python3 tools/publish_urls.py "$SITE_ORIGIN$BASE_URL" public --check
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Spiegelt dieses Repository nach github.com/konradvoelkel/eidl-skript-mirror -- nach dem
# Vorbild des gleichnamigen Jobs in ds-skript, der dort seit dem 2026-10-15 laeuft. Die
# Kommentare halten fest, woran dessen erste Anlaeufe gescheitert sind, damit das hier nicht
# ein zweites Mal durchgespielt wird.
#
# Zwei Gruende fuer den Spiegel: Die HHU-GitLab laesst `git` ueber HTTP nur mit Zugangsdaten
# zu (die Projektseite antwortet 200, `info/refs` antwortet 401), ein fremder Runner kommt
# also nicht an dieses Repo heran; und Fehlermeldungen sind auf GitHub leichter einzureichen.
# **GitLab bleibt die Quelle.** In den Spiegel schreibt nichts ausser diesem Job.
#
# **Kein `allow_failure`, mit Absicht.** Ein still scheiternder Spiegel sieht von aussen genau
# so aus wie "hier hat sich nichts geaendert", und diese Stille ist die eigentliche Gefahr.
mirror-to-github:
  stage: deploy
  # `entrypoint: [""]` ist noetig, nicht Kosmetik: alpine/git setzt `git` selbst als
  # Entrypoint, der Runner haengt seinen Shell-Aufruf hinten an, und der Job stirbt sofort
  # mit "git: 'sh' is not a git command". Genau so ist der erste Versuch in ds-skript
  # gescheitert.
  #
  # Fassung angeheftet, wie beim kaniko-Image oben -- ein wanderndes `latest` ist dieselbe
  # unversionierte Abhaengigkeit eine Ebene tiefer. Das ist der einzige bewusste Unterschied
  # zum Job in ds-skript, der dort auf `latest` steht.
  image:
    name: alpine/git:v2.54.0
    entrypoint: [""]
  variables:
    # Dieser Job macht seinen eigenen Spiegelklon; der gewoehnliche Checkout von GitLab waere
    # ein flacher Baum mit einem Branch und damit genau das Falsche.
    GIT_STRATEGY: none
  # Ohne das zieht der Job die Artefakte der build-Stage -- Website und PDF, zweistellige
  # Megabyte -- fuer nichts: Er klont ja selbst.
  dependencies: []
  script:
    # Frueh und verstaendlich abbrechen, statt in einen anonymen Push zu laufen, der mit
    # "Authentication failed" endet und wie ein GitHub-Problem aussieht.
    - test -n "$GITHUB_MIRROR_TOKEN" || { echo "FEHLER - CI-Variable GITHUB_MIRROR_TOKEN fehlt"; exit 1; }
    # Das Token steht bewusst **nicht** in der Push-URL. GitLab maskiert es zwar im Log, aber
    # die Maskierung greift nur auf exakte Treffer, und eine Remote-URL taucht in git-Fehlern,
    # in Trace-Ausgaben und in Fremdwerkzeugen an Stellen auf, die man nicht alle kennt. Der
    # Credential-Store liegt im Container und verschwindet mit ihm.
    - git config --global credential.helper store
    - printf 'https://x-access-token:%s@github.com\n' "$GITHUB_MIRROR_TOKEN" > ~/.git-credentials
    - chmod 600 ~/.git-credentials
    # Spiegelklon, damit die echte Historie mitkommt und nicht nur eine Spitze: Wer spaeter
    # gegen diesen Spiegel rechnet, loest beliebige Commits darin auf.
    - git clone --mirror "$CI_REPOSITORY_URL" repo.git
    # Explizite Refspecs statt `--mirror`. `--mirror` schickt *jede* Ref, die der Klon kennt,
    # und ein Klon ueber CI_REPOSITORY_URL kennt auch GitLabs interne `refs/pipelines/<id>`
    # -- eine pro Lauf, die sich drueben ewig ansammeln wuerden. Der erste erfolgreiche Lauf
    # in ds-skript hat genau das getan. Heads und Tags sind, was ein Spiegel braucht;
    # `--prune` raeumt drueben auf, was hier geloescht wurde, bleibt dabei aber innerhalb
    # dieser beiden Refspecs.
    - |
      git -C repo.git push --prune https://github.com/konradvoelkel/eidl-skript-mirror.git \
        "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
    - git -C repo.git rev-parse HEAD
  # Die Strecke zwischen HHU und der Aussenwelt flattert, in beide Richtungen (in ds-skript
  # am 2026-10-15 gemessen: drei Anlaeufe auf demselben Runner, 12 s Ablehnung, 133 s
  # Connect-Timeout, dann 25 s Erfolg). Ein Netzaussetzer darf nicht wie ein kaputtes Token
  # aussehen. Ein 401 bleibt auch beim dritten Versuch ein 401.
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
