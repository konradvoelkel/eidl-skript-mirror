stages:
  - image
  - build
  - deploy

variables:
  BASE_URL: "" # "/$CI_PROJECT_NAME"
  HOST: "127.0.0.1"
  # Die Adresse, unter der das Buch wirklich steht. MyST kennt sie beim Bauen nicht und
  # schreibt statt dessen die seines eigenen Dev-Servers in sitemap.xml und robots.txt;
  # der pages-Job traegt sie nach (tools/publish_urls.py).
  #
  # Bewusst der 131e30-Host und nicht "voelkel.pages.cs.uni-duesseldorf.de/eidl-skript":
  # Diese zweite Schreibweise antwortet mit 308 auf die erste (am 2026-10-19 gemessen).
  # Canonical, og:url und jede <loc> muessen die URL nennen, die 200 liefert.
  SITE_ORIGIN: "https://eidl-skript-131e30.pages.cs.uni-duesseldorf.de"

# Baut das Projekt-Image neu, wenn sich sein Rezept aendert. Ohne das bleibt das Image im
# Registry auf dem Stand seines letzten Baus stehen, waehrend das Repo etwas anderes
# behauptet -- der haeufigste CI-Ausfall dieser Buchfamilie (siehe PLAYBOOK 3.1).
#
# `kaniko` statt Docker-in-Docker: braucht keinen privilegierten Runner und laeuft mit dem
# gewoehnlichen docker-Executor. Zugangsdaten kommen aus den von GitLab selbst gesetzten
# Variablen; hier steht kein Geheimnis im Klartext.
#
# Zwei Tags: `latest` benutzen die anderen Jobs, das Kurz-SHA erlaubt es, im Zweifel auf
# ein bestimmtes Image zurueckzugehen.
# Holt das HHU-Theme aus den Secure Files des Projekts und reicht es als Artefakt an
# `build-image` weiter. Python aus der Standardbibliothek, damit weder `curl` noch ein
# `apk add` noetig ist -- und ganz bewusst nicht der Installer von gitlab.com, der ein
# unangeheftetes Skript als root ausfuehrt. Fehlt die Datei, endet der Job mit 0 und sagt
# es; `build-slides` scheitert dann sichtbar.
fetch-theme:
  # `.pre` statt `image`: Diese Stufe laeuft immer vor allen anderen, und damit gilt das
  # `needs` von build-image auch dann, wenn jemand die Stufen umsortiert.
  stage: .pre
  image: python:3.13-alpine
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - when: always
  script:
    - python3 tools/fetch_secure_file.py hhubeamer.tar.gz ci/hhubeamer.tar.gz
    - 'if [ -f ci/hhubeamer.tar.gz ]; then tar -tzf ci/hhubeamer.tar.gz | wc -l | xargs echo "Dateien im Theme-Archiv:"; fi'
  artifacts:
    when: always
    paths:
      - ci/hhubeamer.tar.gz

build-image:
  stage: image
  image:
    # Version angeheftet -- ein unangehefteter `:debug`-Tag ist derselbe Fehler eine Ebene
    # hoeher.
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    # Auf Branches ausserhalb des Default-Branch nie.
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    # Automatisch, wenn sich das Image-Rezept aendert. `devnotes/patch_myst_tex.py` gehoert
    # dazu: Das Dockerfile kopiert die Datei hinein und fuehrt sie aus.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Dockerfile
        - .dockerignore
        - devnotes/patch_myst_tex.py
    # Und von Hand ausloesbar, etwa wenn das Basis-Image angehoben wurde.
    - when: manual
      allow_failure: true
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:latest"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --cache=true --cache-repo "${CI_REGISTRY_IMAGE}/cache"
      --cache-ttl=336h --snapshot-mode=redo
  # Das Theme kommt als Artefakt aus `fetch-theme` in den Build-Kontext. Es darf nicht ins
  # Repository (kein Lizenzvermerk, HHU-Bildmarke, oeffentlicher GitHub-Spiegel) und liegt
  # deshalb als Secure File im Projekt. Warum ein eigener Job und nicht ein wget hier:
  # Das busybox-wget in kaniko:debug kann kein TLS gegen diesen Server -- am 2026-11-04 in
  # Job 674487 gemessen ("TLS error from peer (alert code 47)").
  needs:
    - job: fetch-theme
      artifacts: true





# Kein `needs` auf build-image: Wenn das Dockerfile unveraendert ist, ist der Job manuell,
# und eine `needs`-Abhaengigkeit auf einen wartenden manuellen Job wuerde diesen Job (und
# damit die ganze Pipeline) ueberspringen. Die Stage-Reihenfolge baut das Image ohnehin
# zuerst; weil die Pull-Policy des Runners `always` ist, benutzt dieser Job in derselben
# Pipeline schon das neue Image.
#
# Das Site-Template liegt im Projekt (`_site/vendor/book-theme.zip`) und wird vor dem Build
# an die Stelle entpackt, an der MyST es zwischenspeichert. Ohne das laedt `myst build` es
# bei *jedem* Lauf von `book-theme/archive/refs/heads/main` -- von einem wandernden Branch,
# was zweimal weh tut: Das Aussehen der Seite ist eine unversionierte Abhaengigkeit, und
# jeder Netzausfall bricht den Build. Begruendung in `_site/vendor/README.md`.
#
# `retry` deckt nur Runner- und Timeout-Probleme ab, bewusst *ohne* `script_failure`: Ein
# echter Fehler im Buch soll einmal scheitern, nicht dreimal.
myst-build:
  stage: build
  image: $CI_REGISTRY_IMAGE:latest
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - python3 _site/vendor/install_template.py
    # Die Vorschaukarte ist eingecheckt und steht als `thumbnail:` in myst.yml. Geprueft
    # wird die Form (1200x630) und, aus dem tEXt-Block der PNG, ob sie noch den Titel
    # aus myst.yml zeigt -- erzeugt wird sie nie in der CI. Nur Standardbibliothek.
    - python3 tools/social_card.py --verify
  script:
    - node -v
    - myst --version
    - myst build --html
    # Die beiden Schriften mitnehmen. Seit dem 2026-11-03 holt `_site/custom-style.css`
    # sie nicht mehr von Google, sondern von hier (Begruendung im Kopf jener Datei und in
    # `_site/fonts/PROVENANCE.txt`, Port aus eipy). **MyST kopiert aus `_site/` nur das
    # Stylesheet selbst**, die Schriften also von Hand -- samt der OFL, die das verlangt.
    - mkdir -p _build/html/fonts
    - cp _site/fonts/*.woff2 _site/fonts/OFL-*.txt _build/html/fonts/
    # Eine leere oder fehlende Schriftdatei faellt im Browser nicht auf -- es wird die
    # Ersatzschrift gerendert, und die Seite sieht nur ein wenig anders aus.
    - |
      for f in inter-latin.woff2 jetbrains-mono-latin.woff2; do
        [ -s "_build/html/fonts/$f" ] || { echo "FEHLER: _build/html/fonts/$f fehlt oder ist leer"; exit 1; }
      done
      echo "ok: beide Schriften im Artefakt"
  artifacts:
    paths:
      - _build/html

# PDF via xelatex (TeX Live steckt im CI-Image). `allow_failure: true` ist eine bewusste
# Asymmetrie: Der Web-Bau blockiert die Veroeffentlichung, der PDF-Bau nicht -- ein
# LaTeX-Problem soll die Website nicht aufhalten. Der Fehlschlag ist in der Pipeline
# trotzdem sichtbar.
#
# Wichtig: `myst build --pdf` allein genuegt **nicht** als Pruefung. Der Befehl endet auch
# dann mit Exit-Code 0, wenn LaTeX nach hundert Fehlern abgebrochen ist und die Haelfte des
# Buchs im PDF fehlt (in eipy-skript am 2026-09-25: 226 statt 435 Seiten, Exit 0). Deshalb
# laeuft danach devnotes/check_pdf_build.py: Es zaehlt Fehler im `-file-line-error`-Format,
# erkennt den Abbruch wegen Fehlerflut, zaehlt fehlende Glyphen und prueft Seitenzahl sowie
# Stichproben aus den letzten Kapiteln.
#
# Die Ausgabe von MyST wird mitgeschrieben: MyST meldet **dort** (nicht im LaTeX-Log), wenn
# es einen Knoten nicht uebersetzen kann und weglaesst -- mit Exit 0.
#
# Die beiden `--expect`-Kommandozeilen sind die Gegenprobe zu dem Fehler, den
# devnotes/patch_myst_tex.py behebt: Ohne den Patch stuende dort `nvidia -smi` und
# `- -index -url`, und dieser Job wuerde es merken.
#
# Lokal bauen: `uv run --only-group dev myst build --pdf` (nach `uv sync` einmal
# `uv run --no-project devnotes/patch_myst_tex.py`).
build-pdf:
  stage: build
  image: $CI_REGISTRY_IMAGE:latest
  allow_failure: true
  before_script:
    - python3 _site/vendor/install_template.py
  script:
    - myst build --pdf 2>&1 | tee myst-pdf.log
    - python3 devnotes/check_pdf_build.py
        --min-pages 100
        --expect "Adversarial Example"
        --expect "nvidia-smi"
        --expect "pip install torch torchvision --index-url"
        --myst-log myst-pdf.log
  artifacts:
    paths:
      - exports/eidl-skript.pdf

# Die fuenfzehn Beamer-Decks. Sie wurden bis zum 2026-11-04 nur lokal gebaut und ueber
# ILIAS verteilt; seitdem liegen sie auch auf der Website, damit das Skript sie an der
# Aufzeichnungszeile verlinken kann (mit `#page=`, siehe CLAUDE.md).
#
# `allow_failure: true` mit Absicht: Das Theme kommt aus einer Secure File (siehe
# build-image). Fehlt sie, soll die Pipeline nicht rot werden, sondern dieser eine Job --
# und zwar mit einer Meldung, die sagt warum, statt mit 15 LaTeX-Fehlern.
build-slides:
  stage: build
  # `pull_policy: always`, und das ist kein Luxus: Am 2026-11-04 lief dieser Job gegen
  # ein **zwischengespeichertes** `:latest` (sha256:3539ebef) und meldete das fehlende
  # Theme, waehrend die Registry laengst das neue Image hatte (sha256:c3109d59). Der
  # Runner holt `:latest` sonst nur, wenn er es noch nicht kennt -- und `latest` ist
  # genau der Tag, hinter dem sich der Inhalt aendert, ohne dass der Name es sagt.
  image:
    name: $CI_REGISTRY_IMAGE:latest
    pull_policy: always
  allow_failure: true
  script:
    - kpsewhich beamerthemehhubeamer.sty > /dev/null || { echo "FEHLER - das HHU-Theme fehlt im Image. Secure File hhubeamer.tar.gz hinterlegen und build-image von Hand ausloesen."; exit 1; }
    - cd slides && ./build.sh && cd ..
    # Die Schrift wird **am Ergebnis** geprueft, nicht an `fc-list`. Zwei Gruende: Der Job
    # sah am 2026-11-04 eine leere fontconfig-Liste, obwohl der Image-Bau "Schrift da:
    # 14 Schnitte" gemeldet hatte -- und vor allem ist die Frage ohnehin nicht, was
    # fontconfig kennt, sondern was im PDF steht. Faellt LuaTeX still auf Latin Modern
    # zurueck (PLAYBOOK-folien §2.3), sieht man genau das hier.
    - 'pdffonts slides/*VL\ 04*.pdf | grep -q SourceSans3 || { echo "FEHLER - das Deck ist nicht in Source Sans 3 gesetzt; faellt LuaTeX auf Latin Modern zurueck?"; pdffonts slides/*VL\ 04*.pdf; exit 1; }'
    # Die Zahl melden, auf die der Schritt gewirkt hat, nicht dass er lief.
    - ls -1 slides/*.pdf | wc -l | xargs echo "Decks gebaut:"
  artifacts:
    paths:
      - slides/*.pdf

# Veroeffentlicht die Website **und** das PDF. Ein Job-Artefakt allein genuegt nicht: Es
# verfaellt und ist nur ueber die Job-Seite erreichbar, also nicht verlinkbar. Unter
# `public/` liegt es als `<pages-url>/eidl-skript.pdf`, und `downloads:` in myst.yml
# verlinkt genau diesen Pfad im Buch.
pages:
  stage: deploy
  # Frueher busybox:latest. Jetzt Alpine mit Python, weil die drei Nachbearbeitungen
  # unten Python brauchen; installiert wird dabei **kein** Paket, sie kommen mit der
  # Standardbibliothek aus (CLAUDE.md, bewusste Entscheidung 5).
  image: python:3.13-alpine
  needs:
    - myst-build
    - build-pdf
    - job: build-slides
      artifacts: true
  variables:
    # tools/inject_jsonld.py liest das Aenderungsdatum je Kapitel aus "git log" der
    # Quelldatei. GitLab klont flach (GIT_DEPTH 20); gegen einen Commit ohne Eltern
    # meldet git *jede* Datei als von ihm geaendert, und dann traegt jede Seite die
    # Sekunde des Deploys statt ihres echten Datums. Also volle Historie fuer diesen Job.
    GIT_DEPTH: "0"
  script:
    # git nachinstallieren: python:3.13-alpine bringt keins mit, und ohne git bricht
    # inject_jsonld.py ab (absichtlich -- es raet kein Datum).
    #
    # brotli dazu: Python kennt das Verfahren nicht, und tools/precompress.py ruft deshalb
    # das Programm auf. Fehlt es, bricht das Skript ab statt die .br still wegzulassen.
    - apk add --no-cache git brotli >/dev/null
    - mv _build/html public
    # Ganze Zeile in Anfuehrungszeichen: Ein `: ` in einem unquotierten YAML-Skalar macht
    # aus dem Listeneintrag eine Map. Die Datei bleibt dabei valides YAML, GitLab lehnt sie
    # aber ab ("script config should be a string") -- und dann laeuft kein einziger Job.
    # devnotes/check_ci_yaml.py prueft das vor dem Push.
    - 'if [ -f exports/eidl-skript.pdf ]; then cp exports/eidl-skript.pdf public/; echo "PDF veroeffentlicht"; else echo "WARNUNG - kein PDF im Artefakt, Website ohne PDF"; fi'
    # Die Decks unter kurzen, stabilen Adressen: `public/folien/vl04.pdf`. Die Dateinamen im
    # Repository tragen Leerzeichen und Umlaute ("Einfuehrung in Deep Learning 2026 VL 04
    # ..."), die in einer URL beides nur Aerger sind; verlinkt wird aus den Kapiteln ohnehin
    # mit `#page=`, und dafuer muss die Adresse kurz und vorhersagbar sein. Gezaehlt wird,
    # was ankam -- fehlt der Artefakt (Theme fehlt im Image), sagt die Zeile das.
    - 'mkdir -p public/folien; n=0; for f in slides/*VL*.pdf; do [ -e "$f" ] || continue; nr=$(echo "$f" | sed -n "s/.*VL \([0-9]\{2\}\).*/\1/p"); [ -n "$nr" ] || continue; cp "$f" "public/folien/vl$nr.pdf"; n=$((n+1)); done; echo "Foliensaetze veroeffentlicht: $n"'
    # Google Search Console, Datei-Methode. Die Datei aus der Search Console liegt in
    # `_site/` und wird hier nach `public/` kopiert; sie ist dann unter
    # `<pages-url>/google<token>.html` abrufbar. Kein Geheimnis -- oeffentlich abrufbar
    # zu sein ist ja gerade der Eigentumsnachweis.
    #
    # Die Meta-Tag-Methode waere seit tools/head_meta.py ebenfalls billig (das Skript
    # patcht den <head> ohnehin). Die Datei bleibt trotzdem die Wahl: Sie haengt an
    # keiner Annahme ueber das erzeugte HTML und ueberlebt damit jedes MyST-Update.
    #
    # Die drei Nachbearbeitungen unten fassen sie nicht an -- alle drei laufen ueber
    # `index.html`, und `--check` prueft Canonicals nur dort. Fehlt die Datei, laeuft
    # der Job trotzdem durch.
    - 'if ls _site/google*.html >/dev/null 2>&1; then cp _site/google*.html public/; echo "Google-Verifikationsdatei veroeffentlicht"; else echo "Hinweis - keine Google-Verifikationsdatei in _site/"; fi'
    # --- Fremde Herkuenfte: von vier auf null ----------------------------------------
    # Port aus eipy (2026-10-20), dort mit Messungen; PLAYBOOK §3.12 "Fremde Herkuenfte".
    # `__BASE__` in den Schrift-URLs aufloesen. MyST legt dasselbe Stylesheet an zwei
    # Orten ab -- `/myst-theme.css` und `/build/custom-style-<hash>.css` --, und ein
    # relativer Pfad kann nicht fuer beide stimmen. Deshalb der Platzhalter.
    - find public \( -name 'myst-theme.css' -o -name 'custom-style-*.css' \) -exec sed -i "s|__BASE__|$BASE_URL|g" {} +
    # Die drei Stylesheets, die das **Theme** von zwei CDN holt (KaTeX, Font Awesome,
    # jupyter-matplotlib), von hier ausliefern -- dazu die KaTeX-Schriften, die das
    # Stylesheet relativ zu seiner eigenen URL nachzieht. Umgeschrieben in HTML **und**
    # JS: Remix rendert den Kopf aus Route-Modulen, nur das Markup umzuschreiben hiesse,
    # dass die Hydration die CDN-Links wieder hinzufuegt. Kopiert werden nur die drei
    # Unterbaeume von `_site/vendor/`, nicht `book-theme.zip` daneben.
    - python3 tools/vendor_assets.py public --base "$BASE_URL"
    - python3 tools/check_css_assets.py public --base "$BASE_URL"
    # Und nachsehen, dass keine der vier Herkuenfte mehr darin steht, die ein blosser
    # Seitenaufruf anfragt. **Gezielt** und nicht pauschal nach der Domain: thebe-core
    # traegt MathJax und require.js von cdnjs im Bundle und holt sie erst, wenn jemand die
    # Rechenumgebung startet. Geprueft wird, was die Seiten **einbinden** -- lokal haelt
    # `_build/` fingerprinted Fassungen frueherer Laeufe, die keine Seite laedt.
    #
    # **Ohne `grep --include`**: das Image ist Alpine, dessen grep ist BusyBox, und die
    # Option ist eine GNU-Erweiterung. Aus eipy (python:3.14-slim) uebernommen, lief der
    # Block hier am 2026-11-03 in "unrecognized option" und brach den Deploy ab (Job
    # 673689). Deshalb `find ... -exec grep`.
    #
    # **Und ohne `| grep -q .` und ohne `| head`**: der Runner schaltet `pipefail` ein,
    # wo die Shell es kann (BusyBox-ash kann es). Ein Leser, der nach der ersten Zeile
    # aufhoert, laesst den Schreiber davor an SIGPIPE sterben, und die Pipeline gilt als
    # gescheitert -- so meldete der zweite Lauf "katex.min.css wird von keiner Seite
    # eingebunden", obwohl alle 32 es tun, und die zwei Pruefungen darueber haetten einen
    # echten Treffer verschluckt. Also erst in eine Variable, dann `[ -n ]`; und `|| true`,
    # wo "kein Treffer" der gute Fall ist (grep endet dann mit 1).
    - |
      eingebunden=$(find public -name '*.html' -exec grep -ho 'href="[^"]*\.css"' {} + \
        | sed 's/href="//; s/"$//; s|^/||' | sort -u)
      ziele=$(find public -name '*.html')
      for p in $eingebunden; do
        if [ -f "public/$p" ]; then ziele="$ziele public/$p"; fi
      done
      treffer=$(grep -lE 'https://fonts\.(googleapis|gstatic)\.com' $ziele || true)
      if [ -n "$treffer" ]; then
        echo "FEHLER: eine Seite oder ein eingebundenes Stylesheet holt noch Schriften von Google"
        echo "$treffer"
        exit 1
      fi
      treffer=$(grep -lE 'https://(cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com)/[^"]*\.css' $ziele || true)
      if [ -n "$treffer" ]; then
        echo "FEHLER: ein CDN-Stylesheet ueberlebt im Markup"
        echo "$treffer"
        exit 1
      fi
      for f in vendor/katex/katex.min.css vendor/font-awesome/css/font-awesome.css \
               vendor/jupyter-matplotlib/mpl_widget.css; do
        [ -s "public/$f" ] || { echo "FEHLER: public/$f fehlt oder ist leer"; exit 1; }
        seiten=$(find public -name '*.html' -exec grep -l "$f" {} + || true)
        [ -n "$seiten" ] || { echo "FEHLER: $f wird von keiner Seite eingebunden"; exit 1; }
      done
      echo "ok: keine Schrift und kein Stylesheet mehr von fremder Herkunft, drei vendorierte Pfade da und eingebunden"
    # thebe-core (1,3 MB, 359 kB komprimiert) laedt das Theme per useEffect auf **jeder**
    # Seite, unabhaengig von `jupyter:` in myst.yml -- und kein Kapitel dieses Buchs hat
    # etwas Ausfuehrbares. Port aus ds-en: ein Ausdruck im einen Client-Chunk, der das
    # Laden an MySTs eigenes `computable` je Seite knuepft. Scheitert laut, wenn ein
    # mystmd-Update die minifizierte Form verschiebt, statt die 1,3 MB still
    # zurueckzubringen. Nach vendor_assets.py, das dieselben Buendel anfasst.
    - python3 tools/thebe_gate.py public
    # --- Veroeffentlichungs-Metadaten ---------------------------------------------------
    # 1. Die echte Adresse in sitemap.xml und robots.txt, jede <loc> mit Schraegstrich,
    #    og:image absolut, Canonical je Seite. Ohne diesen Schritt nennt die Sitemap
    #    30-mal "http://localhost:3000" und die Vorschaukarte bleibt in jedem geteilten
    #    Link leer. Begruendung im Docstring des Skripts.
    - python3 tools/publish_urls.py "$SITE_ORIGIN$BASE_URL" public --base "$BASE_URL"
    # 2. og:url, og:site_name, og:type, og:locale, twitter:card; lang="de" samt Waechter
    #    gegen die Hydration; zu kleine Abbildungen als Vorschaukarte durch die echte
    #    Karte ersetzen; Abbildungen unter der Falz verzoegert laden. **Nach** Schritt 1:
    #    og:url bekommt dieselbe URL wie der Canonical.
    - python3 tools/head_meta.py "$SITE_ORIGIN$BASE_URL" public --lang de
    # 3. JSON-LD: ein Buchknoten mit den zwei anderen Skripten desselben Autors auf der
    #    Landingpage, je ein Kapitelknoten mit Brotkrume auf den 29 uebrigen Seiten.
    #    **Nach** 1 und 2: Es liest die absolute Karten-URL und den Kapiteltitel zurueck.
    - python3 tools/inject_jsonld.py "$SITE_ORIGIN$BASE_URL" public
    # Datum je Seite aus "git log" der Quelldatei, nicht aus der Bauzeit: article:
    # modified_time in jeden Kopf, <lastmod> in jeden Sitemap-Eintrag (vorher null von
    # 32). Port aus ds-skript; braucht wie inject_jsonld die volle Historie (GIT_DEPTH).
    - python3 tools/freshness.py public
    # llms.txt, llms-full.txt und der Markdown-Quelltext je Kapitel samt
    # <link rel="alternate" type="text/markdown">. Port aus ds-skript; Google ignoriert
    # llms.txt erklaertermassen, der Nutzen liegt bei den .md-Dateien. Vor precompress.
    - python3 tools/llms_txt.py "$SITE_ORIGIN$BASE_URL" public
    # --- Layoutsprung (CLS) ---------------------------------------------------------
    # Beides Ports aus ds-skript (2026-10-29), Begruendung und Messungen in den Skripten.
    # 4. Die echten Pixelmasse an jede Abbildung, als width/height ins Markup und als ein
    #    <style id="bildmasse"> fuer das ganze Buch in jeden Kopf -- sonst ist eine
    #    Abbildung null Pixel hoch, bis ihre ersten Bytes da sind, und der Text darunter
    #    ruckt. **Nach** head_meta: erst lazy und Masse zusammen sind die Lage des Lesers.
    - python3 tools/image_dims.py public --base "$BASE_URL"
    # 5. Platz fuer die Gliederung, die das Theme mit leerem <nav> ausliefert und erst
    #    nach dem Mount fuellt; unterhalb von lg steht der Kasten im Fluss, und alles
    #    darunter faellt in dem Moment nach unten.
    - python3 tools/outline_reserve.py public
    # 6. Kapitellinks auf die URL, die 200 liefert. MyST verlinkt "/gans", GitLab Pages
    #    antwortet mit 302 auf "/gans/" (am 2026-11-03 rund 440 Links). Geschrieben wird
    #    im Markup *und* in der Hydrations-Nutzlast samt Seiten-JSON, denn ein Klick ohne
    #    Neuladen rendert aus der Nutzlast. Die Seitenleiste bleibt ohne Schraegstrich:
    #    ihr href kommt aus dem Slug, und ein Schraegstrich dort kostet in ds-skript
    #    gemessen die Vorschaukarten und das Aufklappen. Port aus ds-skript (2026-10-29).
    - python3 tools/trailing_slash.py public --base "$BASE_URL"
    # 7. Den Hinweiskasten "Site not loading correctly? ... BASE_URL" herausnehmen. Er
    #    ist fuer Leser unsichtbar, steht aber als erster Text in jeder Seite -- wer die
    #    Seite als Text liest (Schnipsel, Vorschau, Crawler eines Sprachmodells), beginnt
    #    mit einer Deploy-Fehlermeldung. Dass das Stylesheet da ist, prueft in diesem Job
    #    schon check_css_assets.py (Befund Konrad, 2026-11-04).
    - python3 tools/no_css_dialog.py public
    # Und danach am fertigen Artefakt nachzaehlen statt dem Protokoll zu glauben: kein
    # localhost, je genau ein Canonical, Sitemap-Eintraege gleich gebaute Seiten, keine
    # relative Bild-URL. Ein fehlendes Stueck davon ist im Browser unsichtbar und nur
    # von aussen zu messen -- derselbe Fehlertyp wie die localhost-Sitemap selbst.
    - python3 tools/publish_urls.py "$SITE_ORIGIN$BASE_URL" public --check
    # Masse und Gliederung bewusst hier unten nachpruefen: zwischen dem Schreiben und
    # dieser Zeile liegen alle Schritte, die noch am Markup drehen.
    - python3 tools/image_dims.py public --base "$BASE_URL" --check
    - python3 tools/outline_reserve.py --check public
    - python3 tools/freshness.py --check public
    - python3 tools/trailing_slash.py --check public --base "$BASE_URL"
    - python3 tools/no_css_dialog.py public --check
    # --- Auslieferung -------------------------------------------------------------------
    # GitLab Pages komprimiert nichts, liefert aber eine daneben liegende .br bzw. .gz aus,
    # wenn der Browser sie akzeptiert. Ohne diesen Schritt gingen am 2026-11-03 je Seite
    # 7,7 bis 9,1 MB unkomprimiert ueber die Leitung (PLAYBOOK §3.12, Port aus ds-skript).
    #
    # **Letzter schreibender Schritt, und das ist keine Vorliebe:** ab hier existiert jede
    # Textdatei dreimal, und die .br ist, was praktisch jeder Leser bekommt. Ein Schritt
    # danach, der HTML, CSS oder JS anfasst, liefert allen die alte Fassung aus, waehrend
    # jeder Blick ins Artefakt die neue zeigt. --check packt deshalb jede Kopie wieder aus
    # und vergleicht byteweise, statt nur ihre Existenz zu pruefen.
    - python3 tools/precompress.py public
    - python3 tools/precompress.py public --check
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Spiegelt dieses Repository nach github.com/konradvoelkel/eidl-skript-mirror -- nach dem
# Vorbild des gleichnamigen Jobs in ds-skript, der dort seit dem 2026-10-15 laeuft. Die
# Kommentare halten fest, woran dessen erste Anlaeufe gescheitert sind, damit das hier nicht
# ein zweites Mal durchgespielt wird.
#
# Zwei Gruende fuer den Spiegel: Die HHU-GitLab laesst `git` ueber HTTP nur mit Zugangsdaten
# zu (die Projektseite antwortet 200, `info/refs` antwortet 401), ein fremder Runner kommt
# also nicht an dieses Repo heran; und Fehlermeldungen sind auf GitHub leichter einzureichen.
# **GitLab bleibt die Quelle.** In den Spiegel schreibt nichts ausser diesem Job.
#
# **Kein `allow_failure`, mit Absicht.** Ein still scheiternder Spiegel sieht von aussen genau
# so aus wie "hier hat sich nichts geaendert", und diese Stille ist die eigentliche Gefahr.
mirror-to-github:
  stage: deploy
  # `entrypoint: [""]` ist noetig, nicht Kosmetik: alpine/git setzt `git` selbst als
  # Entrypoint, der Runner haengt seinen Shell-Aufruf hinten an, und der Job stirbt sofort
  # mit "git: 'sh' is not a git command". Genau so ist der erste Versuch in ds-skript
  # gescheitert.
  #
  # Fassung angeheftet, wie beim kaniko-Image oben -- ein wanderndes `latest` ist dieselbe
  # unversionierte Abhaengigkeit eine Ebene tiefer. Das ist der einzige bewusste Unterschied
  # zum Job in ds-skript, der dort auf `latest` steht.
  image:
    name: alpine/git:v2.54.0
    entrypoint: [""]
  variables:
    # Dieser Job macht seinen eigenen Spiegelklon; der gewoehnliche Checkout von GitLab waere
    # ein flacher Baum mit einem Branch und damit genau das Falsche.
    GIT_STRATEGY: none
  # Ohne das zieht der Job die Artefakte der build-Stage -- Website und PDF, zweistellige
  # Megabyte -- fuer nichts: Er klont ja selbst.
  dependencies: []
  script:
    # Frueh und verstaendlich abbrechen, statt in einen anonymen Push zu laufen, der mit
    # "Authentication failed" endet und wie ein GitHub-Problem aussieht.
    - test -n "$GITHUB_MIRROR_TOKEN" || { echo "FEHLER - CI-Variable GITHUB_MIRROR_TOKEN fehlt"; exit 1; }
    # Das Token steht bewusst **nicht** in der Push-URL. GitLab maskiert es zwar im Log, aber
    # die Maskierung greift nur auf exakte Treffer, und eine Remote-URL taucht in git-Fehlern,
    # in Trace-Ausgaben und in Fremdwerkzeugen an Stellen auf, die man nicht alle kennt. Der
    # Credential-Store liegt im Container und verschwindet mit ihm.
    - git config --global credential.helper store
    - printf 'https://x-access-token:%s@github.com\n' "$GITHUB_MIRROR_TOKEN" > ~/.git-credentials
    - chmod 600 ~/.git-credentials
    # Spiegelklon, damit die echte Historie mitkommt und nicht nur eine Spitze: Wer spaeter
    # gegen diesen Spiegel rechnet, loest beliebige Commits darin auf.
    - git clone --mirror "$CI_REPOSITORY_URL" repo.git
    # Explizite Refspecs statt `--mirror`. `--mirror` schickt *jede* Ref, die der Klon kennt,
    # und ein Klon ueber CI_REPOSITORY_URL kennt auch GitLabs interne `refs/pipelines/<id>`
    # -- eine pro Lauf, die sich drueben ewig ansammeln wuerden. Der erste erfolgreiche Lauf
    # in ds-skript hat genau das getan. Heads und Tags sind, was ein Spiegel braucht;
    # `--prune` raeumt drueben auf, was hier geloescht wurde, bleibt dabei aber innerhalb
    # dieser beiden Refspecs.
    - |
      git -C repo.git push --prune https://github.com/konradvoelkel/eidl-skript-mirror.git \
        "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
    - git -C repo.git rev-parse HEAD
  # Die Strecke zwischen HHU und der Aussenwelt flattert, in beide Richtungen (in ds-skript
  # am 2026-10-15 gemessen: drei Anlaeufe auf demselben Runner, 12 s Ablehnung, 133 s
  # Connect-Timeout, dann 25 s Erfolg). Ein Netzaussetzer darf nicht wie ein kaputtes Token
  # aussehen. Ein 401 bleibt auch beim dritten Versuch ein 401.
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
