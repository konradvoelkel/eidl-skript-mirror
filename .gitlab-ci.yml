stages:
  - image
  - build
  - deploy

variables:
  BASE_URL: "" # "/$CI_PROJECT_NAME"
  HOST: "127.0.0.1"

# Builds the CI image from the Dockerfile and pushes it to the project's
# container registry. Runs automatically when the Dockerfile changes on the
# default branch; can also be started manually from the pipeline view.
build-image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Dockerfile
    - when: manual
      allow_failure: true

# No `needs` on build-image: when the Dockerfile is unchanged that job is
# manual, and a `needs` dependency on a pending manual job would skip this job
# (and the whole pipeline). Stage order already runs image builds first.
myst-build:
  stage: build
  image: $CI_REGISTRY_IMAGE:latest
  script:
    - node -v
    - myst --version
    - myst build --html
  artifacts:
    paths:
      - _build/html

pages:
  stage: deploy
  image: busybox:latest
  needs:
    - myst-build
  script:
    - mv _build/html public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
