jtex: v1
title: eidl-skript (plain_latex + amssymb, babel ngerman, HHU-Farben, Kapitel auf neuer Seite)
description: MyST plain_latex template with the additions the EiDL script needs
version: 1.0.0
license: CC-BY-4.0
authors:
  - name: Steve Purves (plain_latex)
  - name: Konrad Völkel (eidl-skript additions)
tags:
  - article
  - vanilla
doc:
  - id: title
    required: true
  - id: authors
    required: true
  - id: date
  - id: bibliography
options:
  - id: link
    type: string
    title: Footnote Link
    description: Footnote containing a link back to the online version
  - id: preamble
    type: string
    title: LaTeX-Praeambel
    description: >-
      Buchspezifisches, wortwoertlich hinter den Import-Block gesetzt: Markenfarbe,
      PDF-Metadaten, \setminted. Muss hier deklariert sein -- jtex verwirft
      undeklarierte Optionen aus der myst.yml kommentarlos (PLAYBOOK 3.8c).
files:
  - template.tex
packages:
  - amssymb
  - caption
  - geometry
  - babel
  - microtype
  - hyphenat
  - fontspec
  - etoolbox
  - xcolor
  - datetime
  - graphicx
  - hyperref
  - natbib
